<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات الإلكترونية</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .error-msg {
            color: #e74c3c;
            margin-top: 10px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        #exam-section {
            display: none;
        }
        .timer {
            font-size: 18px;
            color: #e67e22;
            font-weight: bold;
            text-align: left;
            margin-bottom: 15px;
        }
        .question-box {
            font-size: 18px;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .options-list label {
            display: block;
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
            cursor: pointer;
            font-weight: normal;
            transition: background 0.2s;
        }
        .options-list label:hover {
            background: #e2e6ea;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 10px;
        }
        .nav-buttons button {
            width: auto;
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة تسجيل الدخول -->
    <div id="login-section">
        <h2>تسجيل دخول الاختبار</h2>
        <div class="form-group">
            <label for="student-name">اسم الطالب:</label>
            <input type="text" id="student-name" placeholder="أدخل اسمك ثلاثي هنا">
        </div>
        <div class="form-group">
            <label for="student-code">كود الاختبار:</label>
            <input type="text" id="student-code" placeholder="أدخل كود الدخول">
        </div>
        <button type="button" onclick="verifyAndStart()">دخول الاختبار</button>
        <div id="login-error" class="error-msg">الكود غير صحيح، يرجى التأكد والمحاولة مرة أخرى.</div>
    </div>

    <!-- شاشة الاختبار -->
    <div id="exam-section">
        <div class="timer">الوقت المتبقي: <span id="time-left">10:00</span></div>
        <h3>مرحباً، <span id="display-name"></span></h3>
        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px;">
        
        <div class="question-box" id="question-text">السؤال سيظهر هنا...</div>
        
        <div class="options-list" id="options-container">
            <!-- الخيارات تظهر ديناميكياً -->
        </div>

        <div class="nav-buttons">
            <button type="button" style="background-color: #7f8c8d;" onclick="prevQuestion()">السابق</button>
            <button type="button" id="next-btn" onclick="nextQuestion()">التالي</button>
        </div>
    </div>
</div>

<script>
    // بيانات الأسئلة التجريبية
    const questions = [
        {
            question: "ما هي عاصمة جمهورية مصر العربية؟",
            options: ["الإسكندرية", "القاهرة", "الجيزة", "أسوان"],
            answer: 1
        },
        {
            question: "أي من اللغات التالية تُستخدم لتصميم وتنسيق صفحة الويب (CSS)؟",
            options: ["لغة تنسيق وتصميم صفحات الويب", "لغة برمجة خوادم", "قاعدة بيانات", "نظام تشغيل"],
            answer: 0
        }
    ];

    let currentQuestionIndex = 0;
    let userAnswers = {};
    let timerInterval;

    function verifyAndStart() {
        const nameField = document.getElementById('student-name');
        const codeField = document.getElementById('student-code');
        const errorDiv = document.getElementById('login-error');
        
        if (!nameField || !codeField) return;
        
        const name = nameField.value.trim();
        const code = codeField.value.trim();
        
        if (!name) {
            alert('يرجى إدخال اسم الطالب الكامل!');
            return;
        }
        
        // الكود الافتراضي للدخول هو 100 (يمكنك تغييره حسب رغبتك)
        if (code !== "100") {
            errorDiv.style.display = 'block';
            return;
        }

        errorDiv.style.display = 'none';
        document.getElementById('display-name').innerText = name;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('exam-section').style.display = 'block';
        
        loadQuestion(currentQuestionIndex);
        startTimer();
    }

    function loadQuestion(index) {
        const q = questions[index];
        document.getElementById('question-text').innerText = (index + 1) + ". " + q.question;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach((opt, i) => {
            const checked = userAnswers[index] === i ? 'checked' : '';
            container.innerHTML += `
                <label>
                    <input type="radio" name="option" value="${i}" ${checked} onclick="saveAnswer(${index}, ${i})"> 
                    ${opt}
                </label>
            `;
        });

        // تغيير نص زر التالي إلى "تسليم الاختبار" في السؤال الأخير
        const nextBtn = document.getElementById('next-btn');
        if (index === questions.length - 1) {
            nextBtn.innerText = "تسليم الاختبار";
            nextBtn.style.backgroundColor = "#27ae60";
        } else {
            nextBtn.innerText = "التالي";
            nextBtn.style.backgroundColor = "#3498db";
        }
    }

    function saveAnswer(qIndex, optIndex) {
        userAnswers[qIndex] = optIndex;
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            loadQuestion(currentQuestionIndex);
        } else {
            submitExam();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion(currentQuestionIndex);
        }
    }

    function startTimer() {
        let timeLeft = 600; // 10 دقائق
        const timerDisplay = document.getElementById('time-left');
        
        timerInterval = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            
            timerDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert('انتهى وقت الاختبار!');
                submitExam();
            }
            timeLeft--;
        }, 1000);
    }

    function submitExam() {
        clearInterval(timerInterval);
        alert('تم تسليم الاختبار بنجاح!');
        document.body.innerHTML = `
            <div style="max-width: 600px; margin: 50px auto; background: white; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                <h2 style="color: #27ae60;">تم تسليم الاختبار بنجاح</h2>
                <p style="color: #555; font-size: 18px;">شكراً لك، تم حفظ إجاباتك بنجاح.</p>
            </div>
        `;
    }
</script>

</body>
</html>
