<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلسلة اختبارات الأمين</title>
    <!-- استدعاء خط Cairo و Reem Kufi من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0d3b36;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* كارت العنوان العلوي */
        .header-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 8px 0px #c2a661;
        }

        .main-title {
            font-size: 26px;
            font-weight: 800;
            color: #0b2e2b;
            text-shadow: 0 0 12px rgba(46, 204, 113, 0.6);
            white-space: nowrap;
            margin-bottom: 10px;
        }

        .sub-title {
            font-size: 16px;
            font-weight: 700;
            color: #2c3e50;
        }

        /* كارت تسجيل الدخول والأسئلة */
        .card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .form-title {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #0b2e2b;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: #0b2e2b;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #c8d6e5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #0d3b36;
        }

        .btn {
            width: 100%;
            background-color: #0d3b36;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #082724;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* قسم الأسئلة - مخفي في البداية */
        #quizSection {
            display: none;
        }

        .question-box {
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .question-title {
            font-size: 17px;
            font-weight: 700;
            color: #0b2e2b;
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #f8f9fa;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid #e2e8f0;
        }

        .option-label input {
            cursor: pointer;
        }

        .result-box {
            display: none;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #0d3b36;
            margin-top: 15px;
        }

        /* الفوتر */
        .footer {
            text-align: center;
            color: #d4af37;
            margin-top: 30px;
            padding-bottom: 10px;
        }

        .footer-quote {
            font-family: 'Reem Kufi', cursive;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .footer-rights {
            font-size: 13px;
            color: #ffffff;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- كارت العنوان -->
        <div class="header-card">
            <h1 class="main-title">سلسلة اختبارات الأمين</h1>
            <div class="sub-title">اختبار 3.. العلوم المتكاملة.. 2027</div>
        </div>

        <!-- كارت تسجيل الدخول -->
        <div class="card" id="loginCard">
            <h2 class="form-title">تسجيل الدخول للاختبار</h2>
            
            <form id="quizLoginForm">
                <div class="input-group">
                    <label for="studentName">اسم الطالب الثلاثي:</label>
                    <input type="text" id="studentName" placeholder="أدخل اسمك الكامل" required>
                </div>

                <div class="input-group">
                    <label for="studentCode">كود الطالب:</label>
                    <!-- كلمة توضيحية عبارة عن نجوم بدون كشف أي شيء -->
                    <input type="password" id="studentCode" placeholder="****" required>
                </div>

                <button type="submit" class="btn">بدء الاختبار</button>
                <div id="errorMsg" class="error-message">عذراً، كود الطالب غير صحيح!</div>
            </form>
        </div>

        <!-- كارت الأسئلة (يظهر تلقائياً بعد الدخول) -->
        <div class="card" id="quizSection">
            <h2 class="form-title" id="welcomeStudent"></h2>
            
            <form id="quizForm">
                <!-- السؤال الأول -->
                <div class="question-box">
                    <div class="question-title">1. ما الغاز الذي تستهلكه النباتات أثناء عملية البناء الضوئي؟</div>
                    <label class="option-label"><input type="radio" name="q1" value="a"> الأكسجين</label>
                    <label class="option-label"><input type="radio" name="q1" value="b"> ثاني أكسيد الكربون</label>
                    <label class="option-label"><input type="radio" name="q1" value="c"> النيتروجين</label>
                </div>

                <!-- السؤال الثاني -->
                <div class="question-box">
                    <div class="question-title">2. ما هي وحدة قياس القوة في النظام الدولي؟</div>
                    <label class="option-label"><input type="radio" name="q2" value="a"> النيوتن</label>
                    <label class="option-label"><input type="radio" name="q2" value="b"> الجول</label>
                    <label class="option-label"><input type="radio" name="q2" value="c"> Watt</label>
                </div>

                <button type="submit" class="btn">إنهاء وإرسال الإجابات</button>
            </form>

            <div id="resultBox" class="result-box"></div>
        </div>
    </div>

    <!-- الفوتر -->
    <div class="footer">
        <div class="footer-quote">ما استعان عبدٌ بالله إلا وصل</div>
        <div class="footer-rights">جميع الحقوق محفوظة © أ/ محمد أمين - 2027</div>
    </div>

    <script>
        document.getElementById('quizLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('studentName').value.trim();
            const codeInput = document.getElementById('studentCode').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            const codeNumber = parseInt(codeInput, 10);

            // التحقق من صحة الكود
            if (codeNumber >= 1 && codeNumber <= 100) {
                errorMsg.style.display = 'none';
                
                // إخفاء كارت الدخول وإظهار الأسئلة فوراً في نفس الصفحة
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('quizSection').style.display = 'block';
                document.getElementById('welcomeStudent').innerText = `بالتوفيق يا ${name}`;
            } else {
                errorMsg.style.display = 'block';
            }
        });

        // حساب الدرجة عند تسليم الاختبار
        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let score = 0;
            const q1 = document.querySelector('input[name="q1"]:checked')?.value;
            const q2 = document.querySelector('input[name="q2"]:checked')?.value;

            if (q1 === 'b') score++;
            if (q2 === 'a') score++;

            const resultBox = document.getElementById('resultBox');
            resultBox.innerText = `تم تسليم الإجابات بنجاح! درجتك هي: ${score} من 2`;
            resultBox.style.display = 'block';
        });
    </script>

</body>
</html>
