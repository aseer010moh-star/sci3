<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلسلة اختبارات الأمين</title>
    <!-- استدعاء خط Cairo و Reem Kufi من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0d3b36;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* كارت العنوان العلوي */
        .header-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 8px 0px #c2a661;
        }

        .main-title {
            font-size: 26px;
            font-weight: 800;
            color: #0b2e2b;
            text-shadow: 0 0 12px rgba(46, 204, 113, 0.6);
            white-space: nowrap;
            margin-bottom: 10px;
        }

        .sub-title {
            font-size: 16px;
            font-weight: 700;
            color: #2c3e50;
        }

        /* كارت تسجيل الدخول */
        .login-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .form-title {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #0b2e2b;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: #0b2e2b;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #c8d6e5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #0d3b36;
        }

        .submit-btn {
            width: 100%;
            background-color: #0d3b36;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #082724;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* الفوتر كما كان في الأصل */
        .footer {
            text-align: center;
            color: #d4af37;
            margin-top: 30px;
            padding-bottom: 10px;
        }

        .footer-quote {
            font-family: 'Reem Kufi', cursive;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .footer-rights {
            font-size: 13px;
            color: #ffffff;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- كارت العنوان -->
        <div class="header-card">
            <h1 class="main-title">سلسلة اختبارات الأمين</h1>
            <div class="sub-title">اختبار 3.. العلوم المتكاملة.. 2027</div>
        </div>

        <!-- كارت الدخول -->
        <div class="login-card">
            <h2 class="form-title">تسجيل الدخول للاختبار</h2>
            
            <form id="quizLoginForm">
                <div class="input-group">
                    <label for="studentName">اسم الطالب الثلاثي:</label>
                    <input type="text" id="studentName" placeholder="أدخل اسمك الكامل" required>
                </div>

                <div class="input-group">
                    <label for="studentCode">كود الطالب:</label>
                    <!-- استخدام type="password" لإخفاء الأكواد على شكل نجوم/نقاط -->
                    <input type="password" id="studentCode" placeholder="أدخل الكود (من 1 إلى 100)" required>
                </div>

                <button type="submit" class="submit-btn">بدء الاختبار</button>
                <div id="errorMsg" class="error-message">عذراً، كود الطالب غير صحيح!</div>
            </form>
        </div>
    </div>

    <!-- الفوتر الأخير زي الأول تماماً -->
    <div class="footer">
        <div class="footer-quote">ما استعان عبدٌ بالله إلا وصل</div>
        <div class="footer-rights">جميع الحقوق محفوظة © أ/ محمد أمين - 2027</div>
    </div>

    <script>
        document.getElementById('quizLoginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // منع إعادة تحميل الصفحة

            const name = document.getElementById('studentName').value.trim();
            const codeInput = document.getElementById('studentCode').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            // تحويل الرقم المكتوب إلى رقم صحيح للاختبار
            const codeNumber = parseInt(codeInput, 10);

            // التحقق من أن الكود من 1 إلى 100
            if (codeNumber >= 1 && codeNumber <= 100) {
                errorMsg.style.display = 'none';
                
                // ضع رابط صفحة الاختبار الخاصة بك هنا بدلاً من الرابط المكتوب
                const quizUrl = "https://example.com/quiz-page"; 

                // التحويل المباشر وفوراً بدون أي رسالة تنبيه alert
                window.location.href = quizUrl;
            } else {
                // إظهار نص الخطأ تحت الزر مباشرة بدلاً من alert
                errorMsg.style.display = 'block';
            }
        });
    </script>

</body>
</html>
