<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلسلة اختبارات الأمين</title>
    <!-- خطوط القاهرة والمصحف -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d3b36;
            color: #1a1a1a;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 1. الهيدر العلوي */
        .header-card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 18px 12px;
            text-align: center;
            box-shadow: 0 6px 0px #c2a661;
        }

        .main-title {
            font-size: 24px;
            font-weight: 900;
            color: #0b2e2b;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
            white-space: nowrap;
            margin-bottom: 4px;
        }

        .sub-title {
            font-size: 14px;
            font-weight: 700;
            color: #2c3e50;
        }

        /* 2. كارت الدخول والأسئلة */
        .card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .form-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #0b2e2b;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #0b2e2b;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #c8d6e5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background-color: #0d3b36;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            margin-top: 8px;
            display: none;
        }

        /* 3. عناصر واجهة الأسئلة */
        .hidden { display: none !important; }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 14px;
        }

        .timer-box {
            background: #fee2e2;
            color: #ef4444;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .helpers-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .help-btn {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }

        .help-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .q-text {
            font-size: 15px;
            font-weight: 700;
            color: #0b2e2b;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .option-item {
            background: #f8f9fa;
            border: 1.5px solid #c8d6e5;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
