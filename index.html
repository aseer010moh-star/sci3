<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلسلة اختبارات الأمين - العلوم المتكاملة (الاختبار الثالث)</title>
    <style>
        :root {
            --bg-dark: #0d1b2a;
            --card-bg: #1b263b;
            --primary: #10b981;
            --primary-hover: #059669;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #415a77;
            --accent-gold: #fbbf24;
            --btn-gray: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
            margin-bottom: 75px;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        .header h1 {
            color: var(--primary);
            font-size: 20px;
            margin-bottom: 3px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 12px;
        }

        .quiz-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(13, 27, 42, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .timer {
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .grid-section {
            background: #111e35;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }
        .grid-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-align: center;
        }
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            max-height: 130px;
            overflow-y: auto;
            padding: 2px;
        }
        .q-num-btn {
            background: var(--btn-gray);
            color: white;
            border: 1px solid var(--border-color);
            padding: 6px 0;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .q-num-btn:hover { background: #475569; }
        .q-num-btn.active {
            background: var(--primary);
            color: #0d1b2a;
            font-weight: bold;
            border-color: #34d399;
        }

        .tools-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .tool-btn {
            flex: 1;
            background: #334155;
            color: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 8px;
