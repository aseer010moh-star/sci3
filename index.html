<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلسلة اختبارات الأمين</title>
    <!-- استدعاء خطوط عربية مميزة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b3c3d; /* اللون الداكن للحديث والوجهة */
            --card-bg: #ffffff;
            --text-color: #0b3c3d;
            --accent-green: #00ff66;
            --button-bg: #0b3c3d;
            --gold-color: #dfb256;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 15px;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* الكارت العلوي - العنوان */
        .header-card {
            background-color: var(--card-bg);
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border-bottom: 6px solid var(--gold-color);
        }

        .title-glow {
            font-size: 38px;
            font-weight: 900;
            color: #111;
            text-shadow: 0 0 10px var(--accent-green), 0 0 20px var(--accent-green);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .sub-title-glow {
            font-size: 32px;
            font-weight: 900;
            color: #111;
            text-shadow: 0 0 10px var(--accent-green), 0 0 20px var(--accent-green);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .exam-info {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
        }

        /* كارت تسجيل الدخول */
        .login-card {
            background-color: var(--card-bg);
            border-radius: 25px;
            padding: 30px 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            color: var(--text-color);
        }

        .login-title {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 25px;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid #b2d4d0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            text-align: right;
        }

        .form-group input:focus {
            border-color: var(--button-bg);
            box-shadow: 0 0 5px rgba(11, 60, 61, 0.3);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--button-bg);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .error-message {
            color: #d9534f;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        /* الجزء السفلي المميز */
        .footer {
            margin-top: 30px;
            text-align: center;
        }

        .footer-quote {
            font-family: 'Aref Ruqaa', serif;
            font-size: 28px;
            color: var(--gold-color);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .footer-rights {
            font-size: 14px;
            color: #e0e0e0;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الكارت العلوي -->
        <div class="header-card">
            <div class="title-glow">سلسلة</div>
            <div class="sub-title-glow">اختبارات الأمين</div>
            <div class="exam-info">اختبار الفيزياء - بكالوريا 2027</div>
        </div>

        <!-- كارت التسجيل -->
        <div class="login-card">
            <div class="login-title">تسجيل الدخول للاختبار</div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                
                <!-- 1. اسم الطالب الثلاثي أولاً -->
                <div class="form-group">
                    <label for="studentName">اسم الطالب الثلاثي:</label>
                    <input type="text" id="studentName" placeholder="أدخل اسمك الكامل" required>
                </div>

                <!-- 2. كود الطالب -->
                <div class="form-group">
                    <label for="studentCode">كود الطالب:</label>
                    <input type="number" id="studentCode" placeholder="أدخل الكود (من 1 إلى 100)" min="1" max="100" required>
                </div>

                <button type="submit" class="submit-btn">بدء الاختبار</button>
                <div id="errorMsg" class="error-message">عذراً، يجب أن يكون الكود برقم من 1 إلى 100 فقط!</div>
            </form>
        </div>
    </div>

    <!-- الجزء السفلي الخرافي اللي عاجبك -->
    <div class="footer">
        <div class="footer-quote">ما استعان عبدٌ بالله إلا وصل</div>
        <div class="footer-rights">جميع الحقوق محفوظة © أ/ محمد أمين - 2027</div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            
            const name = document.getElementById('studentName').value.trim();
            const code = parseInt(document.getElementById('studentCode').value, 10);
            const errorMsg = document.getElementById('errorMsg');

            // التحقق من الأكواد (من 1 إلى 100)
            if (code >= 1 && code <= 100) {
                errorMsg.style.display = 'none';
                
                // حفظ البيانات محلياً لاستخدامها في إرسال الإيميل لاحقاً
                localStorage.setItem('studentName', name);
                localStorage.setItem('studentCode', code);

                alert(`أهلاً بك يا ${name}! كودك (${code}) صحيح. جاري تحويلك للأختبار...`);
                
                // هنا يمكنك توجيهه لصفحة الاختبار أو فتح فورم الإيميل
                // window.location.href = "exam.html";
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
